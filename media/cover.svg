      <stop offset="1" stop-color="#062027"/>
    </linearGradient>
    <radialGradient id="aurV"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.32"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
