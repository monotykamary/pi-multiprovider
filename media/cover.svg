<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">pi-multiprovider account transit</title>
  <desc id="desc">Multiple credential accounts converge into one provider and model identity.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d1b"/>
      <stop offset="0.5" stop-color="#171335"/>
      <stop offset="1" stop-color="#071d28"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#background)"/>
  <circle cx="1030" cy="80" r="170" fill="#22d3ee" opacity="0.06"/>
  <circle cx="180" cy="470" r="240" fill="#8b5cf6" opacity="0.08"/>
  <text x="600" y="76" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui" font-size="40" font-weight="700">One provider. Every account.</text>
  <text x="600" y="111" text-anchor="middle" fill="#a5b4fc" font-family="ui-monospace, monospace" font-size="17">auth swaps in transit · identity stays put</text>
  <g font-family="ui-sans-serif, system-ui">
    <path d="M300 190 C450 190 440 260 570 260" fill="none" stroke="url(#line)" stroke-width="5" opacity="0.8"/>
    <path d="M300 260 C450 260 450 260 570 260" fill="none" stroke="url(#line)" stroke-width="5" opacity="0.9"/>
    <path d="M300 330 C450 330 440 260 570 260" fill="none" stroke="url(#line)" stroke-width="5" opacity="0.8"/>
    <path d="M760 260 H900" fill="none" stroke="#22d3ee" stroke-width="6" filter="url(#glow)"/>
    <g>
      <rect x="90" y="158" width="210" height="64" rx="16" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
      <circle cx="125" cy="190" r="12" fill="#a78bfa"/>
      <text x="150" y="197" fill="#ede9fe" font-size="20" font-weight="600">Work account</text>
    </g>
    <g>
      <rect x="90" y="228" width="210" height="64" rx="16" fill="#172554" stroke="#6366f1" stroke-width="2"/>
      <circle cx="125" cy="260" r="12" fill="#818cf8"/>
      <text x="150" y="267" fill="#e0e7ff" font-size="20" font-weight="600">Personal account</text>
    </g>
    <g>
      <rect x="90" y="298" width="210" height="64" rx="16" fill="#083344" stroke="#0891b2" stroke-width="2"/>
      <circle cx="125" cy="330" r="12" fill="#22d3ee"/>
      <text x="150" y="337" fill="#cffafe" font-size="20" font-weight="600">OAuth account</text>
    </g>
    <g filter="url(#glow)">
      <rect x="570" y="202" width="190" height="116" rx="24" fill="#18181b" stroke="url(#line)" stroke-width="3"/>
      <text x="665" y="246" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">scheduler</text>
      <text x="665" y="277" text-anchor="middle" fill="#c4b5fd" font-size="15">lease · health · retry</text>
      <text x="665" y="300" text-anchor="middle" fill="#67e8f9" font-size="15">same-ID lift</text>
    </g>
    <g>
      <rect x="900" y="202" width="220" height="116" rx="24" fill="#06202a" stroke="#22d3ee" stroke-width="3"/>
      <text x="1010" y="247" text-anchor="middle" fill="#ecfeff" font-size="25" font-weight="700">provider/model</text>
      <text x="1010" y="278" text-anchor="middle" fill="#67e8f9" font-size="18">identity unchanged</text>
      <text x="1010" y="301" text-anchor="middle" fill="#94a3b8" font-size="14">stream continues safely</text>
    </g>
  </g>
  <g font-family="ui-monospace, monospace" font-size="15">
    <rect x="365" y="405" width="470" height="54" rx="14" fill="#020617" stroke="#334155"/>
    <text x="395" y="438" fill="#a78bfa">429 account A</text>
    <text x="540" y="438" fill="#64748b">→</text>
    <text x="575" y="438" fill="#22d3ee">account B</text>
    <text x="695" y="438" fill="#64748b">→</text>
    <text x="730" y="438" fill="#86efac">done</text>
  </g>
</svg>
