<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">pi-multiprovider — convergence</title>
  <desc id="desc">Abstract animation: five coloured credential streams flow in from the left, merge inside a glowing scheduler nexus, and leave as one luminous current on the right. One stream periodically cools down and recovers while the rest carry the load.</desc>
